name: Supabase keep-alive

on:
  schedule:
    # GitHub cron uses UTC. This runs on the 1st, 5th, 9th... day of each
    # month, keeping the interval below the 7-day Free Plan inactivity window.
    - cron: '17 3 */4 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Supabase activity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/supabase-keep-alive.mjs
