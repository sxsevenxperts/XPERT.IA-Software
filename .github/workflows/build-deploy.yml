name: Build & Deploy SDR Painel

on:
  push:
    branches: [main]
    paths:
      - 'software/**'
      - '.github/workflows/build-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SDR painel image
        uses: docker/build-push-action@v6
        with:
          context: ./software
          file: ./software/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sdr-software:latest

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /user/packages/container/sdr-software -f visibility=public || echo "Package visibility update skipped"

      - name: Trigger EasyPanel Redeploy (sdr-software)
        run: |
          curl -s "http://187.77.32.172:3000/api/deploy/1cfa9451fed9d34368752f68c1f27a61a65d2bfd1d60a441" \
            && echo "EasyPanel redeploy triggered" \
            || echo "EasyPanel redeploy failed"
